version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/Api/PointbreakLinksApi"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/Client/pointbreak-links-client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
