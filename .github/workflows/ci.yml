name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Api/PointbreakLinksApi
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PointbreakLinksApi.slnx

      - name: Build
        run: dotnet build PointbreakLinksApi.slnx --no-restore --configuration Release

      # Application.Tests mocks every repository/service dependency (Moq) — no database or
      # other external service needed to run it, see PROJECT_MAP.md's "Что уже готово".
      - name: Test
        run: dotnet test Application.Tests/Application.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client/pointbreak-links-client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: Client/pointbreak-links-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # @angular/build:unit-test runs on Vitest (jsdom), not Karma/Chrome — no browser needed.
      - name: Unit tests
        run: npx ng test --watch=false

      - name: Production build
        run: npx ng build --configuration production
