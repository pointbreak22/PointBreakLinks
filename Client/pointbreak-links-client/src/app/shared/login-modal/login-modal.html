<div class="modal-overlay" (click)="close.emit()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    @if (twoFactorTicket()) {
      <div class="modal-header">
        <h2>Код подтверждения</h2>
        <button type="button" class="modal-close" (click)="close.emit()" aria-label="Закрыть">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="modal-body">
        <p class="mb-4 text-sm" style="color: var(--text-muted)">
          Введите 6-значный код из приложения-аутентификатора или один из резервных кодов.
        </p>
        <form [formGroup]="twoFactorForm" (ngSubmit)="submitTwoFactor()" novalidate>
          <div class="form-group">
            <label for="login-two-factor-code">Код</label>
            <input
              id="login-two-factor-code"
              type="text"
              autocomplete="one-time-code"
              formControlName="code"
              class="form-control"
              placeholder="000000 или XXXX-XXXX"
              maxlength="9"
            />
          </div>

          <label class="mb-4 flex items-center gap-2 text-sm text-[var(--text-secondary)]">
            <input type="checkbox" formControlName="rememberDevice" />
            Запомнить это устройство на 30 дней
          </label>

          @if (errorMessage()) {
            <p class="mb-4 text-sm text-red-600" role="alert">{{ errorMessage() }}</p>
          }

          <button type="submit" class="primary-btn w-full justify-center" [disabled]="submitting()">
            {{ submitting() ? 'Проверка...' : 'Подтвердить' }}
          </button>
          <button
            type="button"
            class="mt-3 w-full text-center text-sm"
            style="color: var(--text-muted); background: none; border: none; cursor: pointer"
            (click)="cancelTwoFactor()"
          >
            Назад ко входу
          </button>
        </form>
      </div>
    } @else {
      <div class="modal-header">
        <h2>Вход в PointbreakLinks</h2>
        <button type="button" class="modal-close" (click)="close.emit()" aria-label="Закрыть">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="modal-body">
        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <div class="form-group">
            <label for="login-email">Email</label>
            <input
              id="login-email"
              type="email"
              formControlName="email"
              autocomplete="email"
              class="form-control"
              placeholder="Введите ваш email"
            />
          </div>

          <div class="form-group">
            <label for="login-password">Пароль</label>
            <div class="relative">
              <input
                id="login-password"
                [type]="showPassword() ? 'text' : 'password'"
                formControlName="password"
                autocomplete="current-password"
                class="form-control pr-10"
                placeholder="Введите ваш пароль"
              />
              <button
                type="button"
                class="absolute inset-y-0 right-3 flex items-center text-[var(--text-muted)]"
                (click)="togglePasswordVisibility()"
                [attr.aria-label]="showPassword() ? 'Скрыть пароль' : 'Показать пароль'"
              >
                <i class="fas" [class.fa-eye]="!showPassword()" [class.fa-eye-slash]="showPassword()"></i>
              </button>
            </div>
          </div>

          <label class="mb-6 flex items-center gap-2 text-sm text-[var(--text-secondary)]">
            <input type="checkbox" formControlName="remember" />
            Запомнить меня
          </label>

          @if (errorMessage()) {
            <p class="mb-4 text-sm text-red-600" role="alert">{{ errorMessage() }}</p>
          }

          <button type="submit" class="primary-btn w-full justify-center" [disabled]="submitting()">
            <i class="fas fa-sign-in-alt"></i>
            {{ submitting() ? 'Вход...' : 'Войти' }}
          </button>
        </form>

        <p class="mt-6 text-center text-sm text-[var(--text-muted)]">
          Еще нет аккаунта?
          <a routerLink="/register" class="font-medium text-[var(--primary)]" (click)="close.emit()">Зарегистрироваться</a>
        </p>
      </div>
    }
  </div>
</div>
