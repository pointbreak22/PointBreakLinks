<div class="modal-overlay" (click)="close.emit()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>{{ isEdit() ? 'Редактировать проект' : 'Создать новый проект' }}</h3>
      <button type="button" class="modal-close" (click)="close.emit()" aria-label="Закрыть">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="modal-body">
        <div class="form-group">
          <label for="project-name">Название проекта</label>
          <input id="project-name" type="text" formControlName="name" class="form-control" placeholder="Введите название проекта" />
        </div>

        <div class="form-group">
          <label for="project-url">URL продвигающего сайта</label>
          <input id="project-url" type="text" formControlName="url" class="form-control" placeholder="example.com" />
        </div>

        <div class="form-group">
          <label for="project-task">Задание для вебмастера</label>
          <textarea id="project-task" formControlName="taskForVm" class="form-control" rows="6"></textarea>
        </div>

        <fieldset class="form-group">
          <legend class="mb-2 font-medium" style="color: var(--text-secondary)">Страхование</legend>
          <label class="mb-2 flex items-center gap-2 text-sm" style="color: var(--text-secondary)">
            <input type="checkbox" formControlName="flLossInsurance" />
            <span>Пропажа</span>
          </label>
          <label class="flex items-center gap-2 text-sm" style="color: var(--text-secondary)">
            <input type="checkbox" formControlName="flLossAndIndexationInsurance" />
            <span>Пропажа + неиндексация</span>
          </label>
        </fieldset>
      </div>

      <div class="modal-footer">
        <button type="button" class="secondary-btn" (click)="close.emit()">Отмена</button>
        <button type="submit" class="primary-btn" [disabled]="submitting()">
          {{ isEdit() ? 'Сохранить' : 'Создать проект' }}
        </button>
      </div>
    </form>
  </div>
</div>
