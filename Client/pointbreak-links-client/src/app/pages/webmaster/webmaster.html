<app-header />

<div class="main-container">
  <app-sidebar [webmasterTab]="activeTab()" (webmasterTabChange)="activeTab.set($event)" />

  <main class="content" [class.collapsed]="sidebarService.isCollapsed()">

      <app-my-platforms />
    } @else {
      <app-my-sales />
    }
  </main>
</div>
