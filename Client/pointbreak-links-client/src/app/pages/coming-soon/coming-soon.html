<app-header />

<div class="main-container">
  <app-sidebar />

  <main class="content flex items-center justify-center" [class.collapsed]="sidebarService.isCollapsed()">
    <div
      class="mx-auto max-w-md rounded-(--border-radius-lg) border p-10 text-center"
      style="background: var(--bg-secondary); border-color: var(--border-color)"
    >
      <div class="mb-6 text-6xl opacity-80" style="color: var(--primary)"><i class="fas fa-tools"></i></div>
      <h2 class="mb-4 text-xl font-semibold" style="color: var(--text-primary)">Страница временно недоступна</h2>
      <p class="mb-8" style="color: var(--text-secondary)">
        Мы проводим технические работы или обновляем этот раздел. Пожалуйста, попробуйте зайти позже.
      </p>
      <div class="flex justify-center gap-3">
        <button type="button" class="primary-btn" (click)="goHome()"><i class="fas fa-home"></i> На главную</button>
        <button type="button" class="secondary-btn" (click)="refresh()"><i class="fas fa-sync-alt"></i> Обновить</button>
      </div>
    </div>
  </main>
</div>
